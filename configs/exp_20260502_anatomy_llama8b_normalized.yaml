experiment_id: exp_20260502_anatomy_llama8b_normalized

model:
  name: meta-llama/Meta-Llama-3-8B
  dtype: float16
  device: cuda

dataset:
  eval_path: data/eval/anatomy_sweep.csv
  neg_capture_path: data/eval/mmlu_nonmed_sweep.csv
  capture_n: 100

sweep:
  formulation: both
  layers: [0, 10, 20, 30]
  coef_range:                  # 23 values: coarse outside [-2,2], fine inside
    - [-5,  -2, 1]             # -5, -4, -3, -2
    - [-2,   2, 0.25]          # -2, -1.75, ..., 0, ..., 1.75, 2
    - [2,    5, 1]             # 2, 3, 4, 5
  token_position: last
  normalize_vector: true
  norm_type: unit
  task_prefix: question
  cf_normalization: character
  num_shots: 5
  fewshot_source: data/fewshots/anatomy_fewshot.yaml
  shuffle_choices: true
  layer_name_pattern: "model.layers.{layer_idx}"
  max_length: 2048
  resume: true
  verbose_every: 10

output:
  base_dir: results/

wandb:
  enabled: true
  project: steering-vectors
  tags: [llama3-8b, anatomy, mcf-cf, dataset-capture, normalized-unit]
  notes: "Anatomy sweep, 4 layers, fine-grained coef grid in [-2,2], MMLU non-med neg capture"
  mode: online
