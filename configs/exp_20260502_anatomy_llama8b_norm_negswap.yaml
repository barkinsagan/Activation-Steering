experiment_id: exp_20260502_anatomy_llama8b_norm_negswap

model:
  name: meta-llama/Meta-Llama-3-8B
  dtype: float16
  device: cuda

dataset:
  eval_path: data/eval/anatomy_sweep.csv
  positive_prompts_path: data/prompts/anatomy_neg.txt   # swapped: general facts as positive
  negative_prompts_path: data/prompts/anatomy_pos.txt   # swapped: anatomy facts as negative

sweep:
  formulation: both
  layers: [0, 15, 25]
  coef_range:
    - [-5,  -2, 1]
    - [-2,   2, 0.25]
    - [2,    5, 1]
  token_position: last
  normalize_vector: true
  norm_type: unit
  task_prefix: question
  cf_normalization: character
  num_shots: 5
  fewshot_source: data/fewshots/anatomy_fewshot.yaml
  shuffle_choices: true
  layer_name_pattern: "model.layers.{layer_idx}"
  max_length: 2048
  resume: true
  verbose_every: 10

output:
  base_dir: results/

wandb:
  enabled: true
  project: steering-vectors
  tags: [llama3-8b, anatomy, mcf-cf, text-file-capture, normalized-unit, neg-swap]
  notes: "Pos/neg prompts swapped — sanity check that direction matters"
  mode: online
