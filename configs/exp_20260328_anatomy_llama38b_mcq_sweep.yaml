experiment_id: exp_20260328_anatomy_llama38b_mcq_sweep

model:
  name: meta-llama/Meta-Llama-3-8B
  dtype: float16
  device: cuda

dataset:
  eval_path: data/eval/anatomy_sweep.csv
  positive_prompts_path: data/prompts/anatomy_pos.txt
  negative_prompts_path: data/prompts/anatomy_neg.txt

sweep:
  formulation: both           # mcf | cf | both
  layers: null                # all layers
  coef_list: [-10, -5, 0, 5, 10]
  token_position: last
  normalize_vector: false
  task_prefix: question       # question | goal | fill_in_the_blank | continuation
  cf_normalization: character # none | token | character | pmi
  num_shots: 5
  fewshot_source: data/fewshots/anatomy_fewshot.yaml
  shuffle_choices: true
  layer_name_pattern: "model.layers.{layer_idx}"
  max_length: 2048
  resume: true

output:
  base_dir: results/

wandb:
  enabled: true
  project: steering-vectors
  tags: [llama3-8b, anatomy, mcf-cf, text-file-capture]
  notes: "Anatomy MCQ sweep, all 32 layers, text-file steering prompts"
  mode: online
